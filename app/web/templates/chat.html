<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI对话 - 斐讯R1控制中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background: #f5f5f5; }
        .sidebar { position: fixed; top: 0; left: 0; width: 220px; height: 100vh; background: linear-gradient(180deg, #2196F3 0%, #1976D2 100%); color: white; padding: 20px 0; }
        .sidebar .logo { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar .nav-link { padding: 12px 20px; color: rgba(255,255,255,0.8); border-left: 3px solid transparent; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.1); color: white; border-left-color: white; }
        .sidebar .nav-link i { margin-right: 10px; width: 20px; }
        .main-content { margin-left: 220px; padding: 20px; height: 100vh; display: flex; flex-direction: column; }
        .chat-container { flex: 1; display: flex; flex-direction: column; background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; }
        .message { margin-bottom: 15px; display: flex; align-items: flex-start; }
        .message.user { flex-direction: row-reverse; }
        .message-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin: 0 10px; }
        .message.user .message-avatar { background: #2196F3; color: white; }
        .message.ai .message-avatar { background: #4CAF50; color: white; }
        .message-content { max-width: 70%; padding: 12px 16px; border-radius: 12px; }
        .message.user .message-content { background: #2196F3; color: white; border-bottom-right-radius: 2px; }
        .message.ai .message-content { background: #f5f5f5; border-bottom-left-radius: 2px; }
        .chat-input { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        .chat-input input { flex: 1; border: 1px solid #ddd; border-radius: 25px; padding: 10px 20px; outline: none; }
        .chat-input input:focus { border-color: #2196F3; }
        .chat-input button { border-radius: 25px; padding: 10px 25px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo"><h4>🎵 斐讯R1控制</h4></div>
        <nav class="nav flex-column">
            <a class="nav-link" href="/"><i class="bi bi-house"></i> 首页</a>
            <a class="nav-link" href="/settings"><i class="bi bi-gear"></i> 设置</a>
            <a class="nav-link" href="/music"><i class="bi bi-music-player"></i> 音乐</a>
            <a class="nav-link" href="/ha"><i class="bi bi-house-door"></i> 智能家居</a>
            <a class="nav-link active" href="/chat"><i class="bi bi-chat-dots"></i> AI对话</a>
            <a class="nav-link" href="/voice"><i class="bi bi-mic"></i> 语音控制</a>
            <a class="nav-link" href="/monitor"><i class="bi bi-shield-check"></i> 服务监控</a>
        </nav>
    </div>

    <div class="main-content">
        <h4 class="mb-3">🤖 AI智能对话</h4>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        你好！我是斐讯R1的AI助手。<br>
                        请先在设置页面配置大模型API，然后我可以帮你：<br>
                        • 播放音乐<br>
                        • 控制智能家居<br>
                        • 查询信息<br>
                        • 日常对话
                    </div>
                </div>
            </div>

            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
                <button class="btn btn-primary" onclick="sendMessage()">
                    <i class="bi bi-send"></i> 发送
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function handleKeyPress(e) {
            if(e.key === 'Enter') sendMessage();
        }

        function addMessage(content, isUser) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'ai'}`;
            div.innerHTML = `
                <div class="message-avatar">${isUser ? '👤' : '🤖'}</div>
                <div class="message-content">${content}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if(!message) return;

            // 添加用户消息
            addMessage(message, true);
            input.value = '';

            // 显示loading
            const container = document.getElementById('chatMessages');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai';
            loadingDiv.id = 'loadingMsg';
            loadingDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="spinner-border spinner-border-sm"></div> 思考中...
                </div>
            `;
            container.appendChild(loadingDiv);
            container.scrollTop = container.scrollHeight;

            // 调用AI API
            try {
                const res = await fetch('/api/llm/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: message})
                });
                const data = await res.json();

                document.getElementById('loadingMsg')?.remove();

                if (data.response) {
                    addMessage(data.response, false);
                } else if (data.error) {
                    addMessage('❌ ' + data.error, false);
                } else {
                    addMessage('⚠️ 无法获取回复', false);
                }
            } catch(e) {
                document.getElementById('loadingMsg')?.remove();
                addMessage('❌ 请求失败: ' + e.message, false);
            }
        }
    </script>
</body>
</html>
