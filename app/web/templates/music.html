<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐 - 斐讯R1控制中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background: #f5f5f5; }
        .sidebar { position: fixed; top: 0; left: 0; width: 220px; height: 100vh; background: linear-gradient(180deg, #2196F3 0%, #1976D2 100%); color: white; padding: 20px 0; }
        .sidebar .logo { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar .nav-link { padding: 12px 20px; color: rgba(255,255,255,0.8); border-left: 3px solid transparent; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.1); color: white; border-left-color: white; }
        .sidebar .nav-link i { margin-right: 10px; width: 20px; }
        .main-content { margin-left: 220px; padding: 20px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo"><h4>🎵 斐讯R1控制</h4></div>
        <nav class="nav flex-column">
            <a class="nav-link" href="/"><i class="bi bi-house"></i> 首页</a>
            <a class="nav-link" href="/settings"><i class="bi bi-gear"></i> 设置</a>
            <a class="nav-link active" href="/music"><i class="bi bi-music-player"></i> 音乐</a>
            <a class="nav-link" href="/ha"><i class="bi bi-house-door"></i> 智能家居</a>
            <a class="nav-link" href="/chat"><i class="bi bi-chat-dots"></i> AI对话</a>
            <a class="nav-link" href="/voice"><i class="bi bi-mic"></i> 语音控制</a>
            <a class="nav-link" href="/monitor"><i class="bi bi-shield-check"></i> 服务监控</a>
        </nav>
    </div>

    <div class="main-content">
        <h4 class="mb-4">🎵 音乐服务</h4>

        <!-- 登录状态 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between">
                <span>账号状态</span>
                <span class="badge bg-secondary" id="loginStatus">未登录</span>
            </div>
            <div class="card-body">
                <button class="btn btn-primary" onclick="showQRCode()">
                    <i class="bi bi-qr-code"></i> 二维码登录
                </button>
                <button class="btn btn-outline-secondary" onclick="logout()">退出登录</button>
            </div>
        </div>

        <!-- 二维码弹窗 -->
        <div class="modal fade" id="qrcodeModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">扫码登录</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body text-center">
                        <div id="qrcodeContainer" class="mb-3">
                            <div class="spinner-border text-primary"></div>
                        </div>
                        <p class="text-muted">请使用网易云音乐APP扫码登录</p>
                        <div id="qrStatus" class="alert alert-info">等待扫码中...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 搜索播放 -->
        <div class="card">
            <div class="card-header">搜索与播放</div>
            <div class="card-body">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="searchInput" placeholder="搜索歌曲、歌手...">
                    <button class="btn btn-primary" onclick="searchMusic()">搜索</button>
                </div>

                <div id="searchResults" class="list-group" style="max-height: 400px; overflow-y: auto;">
                    <div class="text-center text-muted py-4">
                        <i class="bi bi-music-note-list fs-1"></i>
                        <p class="mt-2">搜索歌曲开始播放</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 播放控制 -->
        <div class="card">
            <div class="card-header">播放控制</div>
            <div class="card-body text-center">
                <div class="mb-3">
                    <h5 id="nowPlaying">未播放</h5>
                    <small class="text-muted" id="nowArtist"></small>
                </div>
                <div class="btn-group">
                    <button class="btn btn-outline-primary" onclick="playPrev()">
                        <i class="bi bi-skip-backward"></i>
                    </button>
                    <button class="btn btn-primary btn-lg" onclick="togglePlay()">
                        <i class="bi bi-play-fill" id="playIcon"></i>
                    </button>
                    <button class="btn btn-outline-primary" onclick="playNext()">
                        <i class="bi bi-skip-forward"></i>
                    </button>
                </div>
                <div class="mt-3">
                    <i class="bi bi-volume-up"></i>
                    <input type="range" class="form-range" style="width: 200px;" id="volumeSlider">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let qrModal;

        document.addEventListener('DOMContentLoaded', function() {
            qrModal = new bootstrap.Modal(document.getElementById('qrcodeModal'));
        });

        async function showQRCode() {
            qrModal.show();
            document.getElementById('qrStatus').textContent = '正在获取二维码...';
            document.getElementById('qrcodeContainer').innerHTML = '<div class="spinner-border text-primary"></div>';

            try {
                const res = await fetch('/api/music/qrcode');
                const data = await res.json();

                if (data.qrcode) {
                    // 显示二维码图片
                    document.getElementById('qrcodeContainer').innerHTML =
                        `<img src="data:image/png;base64,${data.qrcode}" style="width:200px;height:200px;">`;
                    document.getElementById('qrStatus').textContent = '请使用网易云音乐APP扫码登录';

                    // 轮询检查扫码状态
                    checkQRStatus(data.unikey);
                } else {
                    document.getElementById('qrcodeContainer').innerHTML = '<div class="alert alert-danger">获取二维码失败</div>';
                    document.getElementById('qrStatus').textContent = '请先在设置中配置音乐源API地址';
                }
            } catch (e) {
                document.getElementById('qrcodeContainer').innerHTML = '<div class="alert alert-danger">请求失败: ' + e.message + '</div>';
                document.getElementById('qrStatus').textContent = '请检查API配置';
            }
        }

        let qrCheckInterval = null;

        async function checkQRStatus(unikey) {
            if (qrCheckInterval) clearInterval(qrCheckInterval);

            qrCheckInterval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/music/qrcode/status?unikey=${unikey}`);
                    const data = await res.json();

                    if (data.status === 'SUCCESS') {
                        clearInterval(qrCheckInterval);
                        qrCheckInterval = null;
                        document.getElementById('qrStatus').className = 'alert alert-success';
                        document.getElementById('qrStatus').textContent = '✅ 登录成功！';
                        setTimeout(() => {
                            qrModal.hide();
                            checkLoginStatus();
                        }, 1500);
                    } else if (data.status === 'EXPIRED') {
                        clearInterval(qrCheckInterval);
                        qrCheckInterval = null;
                        document.getElementById('qrStatus').className = 'alert alert-warning';
                        document.getElementById('qrStatus').textContent = '二维码已过期，请重新获取';
                    }
                } catch (e) {
                    console.error('检查二维码状态失败:', e);
                }
            }, 2000);
        }

        async function logout() {
            if(confirm('确定退出登录?')) {
                try {
                    await fetch('/api/music/logout', {method: 'POST'});
                } catch(e) {}
                document.getElementById('loginStatus').textContent = '未登录';
                document.getElementById('loginStatus').className = 'badge bg-secondary';
            }
        }

        // 检查登录状态
        async function checkLoginStatus() {
            try {
                const res = await fetch('/api/music/status');
                const data = await res.json();
                if (data.logged_in) {
                    document.getElementById('loginStatus').textContent = '已登录';
                    document.getElementById('loginStatus').className = 'badge bg-success';
                }
            } catch(e) {}
        }

        // 页面加载时检查登录状态
        checkLoginStatus();

        async function searchMusic() {
            const keyword = document.getElementById('searchInput').value;
            if(!keyword) return alert('请输入搜索关键词');

            document.getElementById('searchResults').innerHTML = '<div class="text-center py-4"><div class="spinner-border"></div></div>';

            try {
                const res = await fetch('/api/music/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({keyword: keyword})
                });
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    const html = data.results.slice(0, 20).map(song => `
                        <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" onclick="playSong('${song.id}', '${song.name}', '${song.artist}')">
                            <span><i class="bi bi-music-note"></i> ${song.name}</span>
                            <small class="text-muted">${song.artist}</small>
                        </button>
                    `).join('');
                    document.getElementById('searchResults').innerHTML = html;
                } else {
                    document.getElementById('searchResults').innerHTML = '<div class="text-center text-muted py-4">未找到相关歌曲</div>';
                }
            } catch (e) {
                document.getElementById('searchResults').innerHTML = '<div class="alert alert-danger">搜索失败: ' + e.message + '</div>';
            }
        }

        let currentSongId = null;

        async function playSong(id, name, artist) {
            currentSongId = id;
            document.getElementById('nowPlaying').textContent = name;
            document.getElementById('nowArtist').textContent = artist;
            document.getElementById('playIcon').className = 'bi bi-pause-fill';

            // 调用后端API，让R1播放
            try {
                const res = await fetch('/api/music/play', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        song_id: id,
                        name: name,
                        artist: artist
                    })
                });
                const data = await res.json();
                if (data.success) {
                    console.log('播放结果:', data.message);
                } else {
                    alert('播放失败: ' + data.message);
                }
            } catch (e) {
                console.error('播放失败:', e);
                alert('播放失败: ' + e.message);
            }
        }

        let isPlaying = false;

        function togglePlay() {
            isPlaying = !isPlaying;
            const icon = document.getElementById('playIcon');
            if(isPlaying) {
                icon.className = 'bi bi-pause-fill';
                if(currentSongId) {
                    fetch('/api/music/play', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({song_id: currentSongId})
                    });
                }
            } else {
                icon.className = 'bi bi-play-fill';
                fetch('/api/music/pause', {method: 'POST'});
            }
        }

        async function playNext() {
            try {
                await fetch('/api/music/next', {method: 'POST'});
            } catch(e) {}
        }

        async function playPrev() {
            try {
                await fetch('/api/music/prev', {method: 'POST'});
            } catch(e) {}
        }
    </script>
</body>
</html>
