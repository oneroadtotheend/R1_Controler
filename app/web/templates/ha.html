<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能家居 - 斐讯R1控制中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background: #f5f5f5; }
        .sidebar { position: fixed; top: 0; left: 0; width: 220px; height: 100vh; background: linear-gradient(180deg, #2196F3 0%, #1976D2 100%); color: white; padding: 20px 0; }
        .sidebar .logo { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar .nav-link { padding: 12px 20px; color: rgba(255,255,255,0.8); border-left: 3px solid transparent; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.1); color: white; border-left-color: white; }
        .sidebar .nav-link i { margin-right: 10px; width: 20px; }
        .main-content { margin-left: 220px; padding: 20px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .device-card { cursor: pointer; transition: all 0.2s; }
        .device-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
        .device-card .icon { font-size: 2rem; }
        .device-on { border-left: 4px solid #4CAF50; }
        .device-off { border-left: 4px solid #FF5722; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo"><h4>🎵 斐讯R1控制</h4></div>
        <nav class="nav flex-column">
            <a class="nav-link" href="/"><i class="bi bi-house"></i> 首页</a>
            <a class="nav-link" href="/settings"><i class="bi bi-gear"></i> 设置</a>
            <a class="nav-link" href="/music"><i class="bi bi-music-player"></i> 音乐</a>
            <a class="nav-link active" href="/ha"><i class="bi bi-house-door"></i> 智能家居</a>
            <a class="nav-link" href="/chat"><i class="bi bi-chat-dots"></i> AI对话</a>
            <a class="nav-link" href="/voice"><i class="bi bi-mic"></i> 语音控制</a>
            <a class="nav-link" href="/monitor"><i class="bi bi-shield-check"></i> 服务监控</a>
        </nav>
    </div>

    <div class="main-content">
        <h4 class="mb-4">🏠 智能家居控制</h4>

        <!-- 连接状态 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Home Assistant 连接状态</span>
                <span class="badge bg-danger" id="haStatus">未连接</span>
            </div>
            <div class="card-body">
                <button class="btn btn-primary btn-sm" onclick="refreshDevices()">
                    <i class="bi bi-arrow-clockwise"></i> 刷新设备
                </button>
                <button class="btn btn-outline-secondary btn-sm" onclick="testConnection()">
                    测试连接
                </button>
            </div>
        </div>

        <!-- 筛选 -->
        <div class="mb-3">
            <div class="btn-group">
                <button class="btn btn-outline-primary btn-sm active" onclick="filterDevices('all')">全部</button>
                <button class="btn btn-outline-primary btn-sm" onclick="filterDevices('light')">💡 灯光</button>
                <button class="btn btn-outline-primary btn-sm" onclick="filterDevices('switch')">🔌 开关</button>
                <button class="btn btn-outline-primary btn-sm" onclick="filterDevices('sensor')">🌡 传感器</button>
            </div>
        </div>

        <!-- 设备列表 -->
        <div class="row" id="deviceList">
            <div class="col-12 text-center text-muted py-5">
                <i class="bi bi-house-door fs-1"></i>
                <p class="mt-2">请先在设置中配置Home Assistant并连接</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function testConnection() {
            document.getElementById('haStatus').textContent = '测试中...';
            document.getElementById('haStatus').className = 'badge bg-warning';

            // 模拟测试
            setTimeout(() => {
                document.getElementById('haStatus').textContent = '未连接';
                document.getElementById('haStatus').className = 'badge bg-danger';
                alert('请先在设置页面配置Home Assistant');
            }, 1000);
        }

        async function refreshDevices() {
            const list = document.getElementById('deviceList');
            list.innerHTML = '<div class="col-12 text-center py-4"><div class="spinner-border"></div></div>';

            setTimeout(() => {
                list.innerHTML = `
                    <div class="col-md-3">
                        <div class="card device-card device-on">
                            <div class="card-body text-center">
                                <div class="icon">💡</div>
                                <h6>客厅灯</h6>
                                <span class="badge bg-success">开</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card device-card device-off">
                            <div class="card-body text-center">
                                <div class="icon">💡</div>
                                <h6>卧室灯</h6>
                                <span class="badge bg-secondary">关</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card device-card device-off">
                            <div class="card-body text-center">
                                <div class="icon">🔌</div>
                                <h6>插座</h6>
                                <span class="badge bg-secondary">关</span>
                            </div>
                        </div>
                    </div>
                `;
            }, 1000);
        }

        function filterDevices(type) {
            // 筛选逻辑
            refreshDevices();
        }
    </script>
</body>
</html>
