name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # p4a builds Python 3.11.13 from source. Install ALL system libs it needs.
      # Missing any of these = silent build failure 30 minutes in.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            ant \
            autoconf \
            automake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libreadline-dev \
            libsqlite3-dev \
            libgdbm-dev \
            libnss3-dev \
            libbz2-dev \
            liblzma-dev \
            libtool \
            patchelf \
            unzip \
            zip \
            git

      - name: Cache Buildozer + p4a
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v2-

      # Force JDK 17 BEFORE setup-android (which would default to JDK 11).
      # cmdline-tools v16+ requires JDK 17 or later.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Android SDK
        uses: android-actions/setup-android@v3

      - name: Set JAVA_HOME
        run: |
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      # P4A uses system freetype to avoid broken download URL
      - name: Install system freetype
        run: sudo apt-get install -y libfreetype6-dev

      # Pin buildozer + cython to versions that work with p4a stable + Python 3.11.
      - name: Install Buildozer + Cython
        run: |
          pip install --upgrade pip
          pip install 'buildozer==1.5.0'
          pip install 'cython>=0.29.1,<=3.0.12'

      # Accept all Android SDK licenses non-interactively.
      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build APK
        run: |
          # Use system freetype (avoid broken download URL)
          export P4A_USE_SYSTEM_FREETYPE=1

          # 第一次 build 触发 cgi 问题是因为 build env 装的是最新 cython(用了 import cgi,
          # Python 3.13+ 移除了 cgi)。我们用 sitecustomize.py + cgi shim 来 hack:
          # 1. 给 hostpython3(3.14)的 site-packages 加 cgi.py(让 cgi 可用)
          # 2. 让 buildozer build 后如果失败,能看到真实错误
          set -o pipefail

          buildozer android debug 2>&1 | tee /tmp/build.log
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "===== buildozer exited $RC; last 80 lines ====="
            tail -80 /tmp/build.log
            exit $RC
          fi
        env:
          P4A_DEBUG: 0

      - name: Show build log on failure
        if: failure()
        run: |
          echo "===== last 100 lines of build log ====="
          tail -100 /tmp/build.log
          echo "===== error grep ====="
          grep -E "ERROR|Exception|Error:" /tmp/build.log | head -30 || true

      - name: Upload APK
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: r1-controller-apk-${{ github.sha }}
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          body: |
            R1 Controller Android APK

            Download and install on your R1 device.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}