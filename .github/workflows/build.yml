name: Build R1 Controller APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable
          workdir: "."

      - name: Rename APK to R1_controler_2.0.0.apk
        run: |
          cd bin
          shopt -s nullglob
          for f in *.apk; do
            mv "$f" "R1_controler_2.0.0.apk"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: R1_controler_2.0.0
          path: bin/R1_controler_2.0.0.apk
